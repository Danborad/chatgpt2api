name: Verify and Publish

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: chatgpt2api

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Compile backend
        run: |
          uv sync --frozen
          uv run python -m compileall -q api contracts services utils main.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-vue/package-lock.json

      - name: Build console
        working-directory: web-vue
        run: |
          npm ci
          npm run build

  release-bundle:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-vue/package-lock.json

      - name: Build runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix web-vue ci
          npm --prefix web-vue run build

          bundle="release/chatgpt2api-app"
          mkdir -p "${bundle}/scripts/image_upscale"
          cp main.py VERSION pyproject.toml uv.lock "${bundle}/"
          cp -R api contracts services utils "${bundle}/"
          cp scripts/image_upscale/upscale.mjs "${bundle}/scripts/image_upscale/"
          cp -R web-vue/dist "${bundle}/web_dist"

          version="$(tr -d '\r\n' < VERSION)"
          cat > "${bundle}/update-manifest.json" <<EOF
          {
            "format": 1,
            "version": "${version}",
            "paths": [
              "main.py",
              "VERSION",
              "api",
              "contracts",
              "services",
              "utils",
              "scripts/image_upscale/upscale.mjs",
              "pyproject.toml",
              "uv.lock",
              "web_dist"
            ]
          }
          EOF

          tar -C release -czf release/chatgpt2api-app.tar.gz chatgpt2api-app
          (cd release && sha256sum chatgpt2api-app.tar.gz > checksums.txt)
          awk -v version="${version}" '
            /^## / {
              if (capture) exit
              capture = index($0, "## " version " - ") == 1
              next
            }
            capture { print }
          ' CHANGELOG.md > release/release-notes.md
          test -s release/release-notes.md

      - name: Upload online update bundle
        uses: softprops/action-gh-release@v2
        with:
          body_path: release/release-notes.md
          files: |
            release/chatgpt2api-app.tar.gz
            release/checksums.txt

  docker:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
